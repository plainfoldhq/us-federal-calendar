name: publish-pypi
# Publishes to PyPI with Trusted Publishing (no token stored) when the version
# in pyproject.toml changes on main, or when run by hand.
on:
  push:
    branches: [main]
    paths: ["pyproject.toml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - run: python -m unittest discover -s tests -v
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
