name: publish-pypi
# Publishes to PyPI with Trusted Publishing (no token stored) when the version
# in pyproject.toml changes on main, or when run by hand.
on:
  push:
    branches: [main]
    paths: ["pyproject.toml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - run: python -m unittest discover -s tests -v
      - uses: pypa/gh-action-pypi-publish@release/v1
