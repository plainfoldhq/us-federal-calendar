[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usbizdays"
version = "1.0.1"
description = "US federal, NYSE and Federal Reserve business days and holidays. No dependencies, no data files."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "Plainfold", email = "plainfoldhq@proton.me" }]
keywords = ["business days", "federal holidays", "NYSE holidays", "trading days", "Federal Reserve holidays", "bank holidays", "add business days", "calendar"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Office/Business :: Scheduling",
]

[project.urls]
Homepage = "https://github.com/plainfoldhq/us-federal-calendar"
Documentation = "https://plainfoldhq.github.io/business-days/"
Source = "https://github.com/plainfoldhq/us-federal-calendar"
Issues = "https://github.com/plainfoldhq/us-federal-calendar/issues"

[project.scripts]
usbizdays = "usbizdays:cli"
